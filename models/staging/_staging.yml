version: 2

models:
  - name: stg_jobs
    description: Deduplicated, type-cast job postings from JSearch.
    columns:
      - name: job_id
        tests: [not_null, unique]
      - name: title
        tests: [not_null]
      - name: posted_date
        tests: [not_null]
      - name: country_code
        tests: [not_null]
      - name: salary_midpoint
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000000

  - name: stg_salary_history
    description: Salary benchmark estimates from JSearch by role and location.
    columns:
      - name: job_title
        tests: [not_null]
      - name: location
        tests: [not_null]
      - name: median_salary
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000000
