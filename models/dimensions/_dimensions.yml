version: 2

models:
  - name: dim_company
    columns:
      - name: company_key
        tests: [not_null, unique]
      - name: company_name
        tests: [not_null]
      - name: raw_name
      - name: company_website
      - name: company_logo
      - name: first_seen
        tests: [not_null]
      - name: last_seen
        tests: [not_null]

  - name: fct_job_postings
    columns:
      - name: job_id
        tests: [not_null, unique]
      - name: company_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_company')
              field: company_key
      - name: posted_date
        tests: [not_null]
      - name: country_code
        tests: [not_null]
      - name: salary_midpoint
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000000

  - name: fct_skill_demand
    columns:
      - name: demand_key
        tests: [not_null, unique]
      - name: posted_date
        tests: [not_null]
      - name: skill_name
        tests: [not_null]
      - name: seniority_band
        tests: [not_null]
      - name: country_code
        tests: [not_null]
      - name: job_count
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: pct_jobs_mentioning
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100

  - name: fct_salary_trends
    columns:
      - name: trend_key
        tests: [not_null, unique]
      - name: salary_month
        tests: [not_null]
      - name: seniority_band
        tests: [not_null]
      - name: country_code
        tests: [not_null]
      - name: jobs_with_actual_salary
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: avg_salary
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000000
      - name: median_salary
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000000
      - name: p25_salary
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000000
      - name: p75_salary
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000000
