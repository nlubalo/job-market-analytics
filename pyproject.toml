[project]
name = "job-market-analytics"
version = "0.1.0"
description = "UK job market analytics pipeline — Adzuna API → Databricks Delta Lake → dbt → Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyspark>=3.5.0",
    "urllib3>=2.7.0",
    "retry>=0.9.2",
    "databricks-cli>=0.18.0",
    "dbt-core>=1.11.11",
    "dbt-databricks>=1.10.9",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "tenacity>=9.1.4",
]

[tool.pyright]
pythonVersion = "3.11"
include = ["scripts"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["W503"]
